<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hệ thống hỗ trợ công tác Tham mưu CAQN.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tham mưu CAQN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tham mưu CAQN</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* CSS cho Loading Screen hiển thị ngay lập tức */
    body {
      margin: 0; padding: 0; background-color: #ffffff;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .container { text-align: center; font-family: sans-serif; }
    .logo {
      width: 120px; height: auto; margin-bottom: 20px;
      animation: fadeIn 1.2s ease-in-out;
    }
    .spinner {
      margin: 0 auto; width: 40px; height: 40px;
      border: 4px solid #f3f3f3; border-top: 4px solid #e60000;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 20px; font-weight: bold; color: #b30000;
      letter-spacing: 1px; text-transform: uppercase;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body>
<div id="loading-indicator">
  <div class="container">
    <img class="logo" src="icons/logocand.png" alt="Logo Công an" />
    <div class="spinner"></div>
    <p class="loading-text">Hệ thống Tham mưu CAQN</p>
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  // 1. Xử lý ẩn màn hình Loading khi Flutter tải xong
  window.addEventListener('load', function() {
    setTimeout(function() {
      var loading = document.getElementById('loading-indicator');
      if (loading) {
        loading.style.opacity = "0";
        setTimeout(() => loading.remove(), 500);
      }
    }, 1500); // Đợi 1.5s để cảm giác chuyển cảnh mượt mà
  });

  // 2. Quản lý Service Worker & Cập nhật thông minh
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    window.isUpdatePromptVisible = false;

    navigator.serviceWorker.register('flutter_service_worker.js')
      .then(reg => {

  // Kiểm tra bản mới định kỳ mỗi 5 phút (tránh spam Firebase)
        setInterval(() => { reg.update(); }, 1000 * 60 * 5);
  // Kiểm tra ngay khi người dùng chạm vào màn hình (nhạy bén khi vừa deploy)
          ['mousedown', 'keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, () => {
              const now = Date.now();
              if (!window.lastCheck || (now - window.lastCheck > 30000)) {
                reg.update();
                window.lastCheck = now;
              }
            }, { once: false });
          });

          // Logic xử lý khi tìm thấy bản cập nhật
          reg.onupdatefound = () => {
            const worker = reg.installing;
            worker.onstatechange = () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                if (window.isUpdatePromptVisible) return;

                window.isUpdatePromptVisible = true;
                if (confirm("Đã có bản cập nhật mới. Cập nhật ngay?")) {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                }
              }
            };
          };
        });

      // Reload trang khi Service Worker mới đã sẵn sàng chiếm quyền
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
</script>
</body>
</html>
