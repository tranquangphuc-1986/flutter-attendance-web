    <style>
        // 1. Thiết kế màn hình Loading ĐỢI CẬP NHẬT đẹp mắt và chuyên nghiệp
        #loading-indicator {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          background-color: #ffffff; /* Màu nền trắng hoặc đỏ thẫm tùy ý bạn */
        }
        .container {
          text-align: center;
        }
        .logo {
          width: 180px;
          height: auto;
          margin-bottom: 20px;
          /* Hiệu ứng hiện dần cho logo */
          animation: fadeIn 1.2s ease-in-out;
        }
        .spinner {
          margin: 0 auto;
          width: 45px;
          height: 45px;
          border: 4px solid #f3f3f3;
          border-top: 4px solid #e60000; /* Màu đỏ cờ đặc trưng */
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        .loading-text {
          margin-top: 20px;
          font-family: Arial, sans-serif;
          font-size: 24px;
          font-weight: bold;
          color: #b30000; /* Màu đỏ thẫm */
          letter-spacing: 1px;
        }
        .sub-text {
          font-family: Arial, sans-serif;
          font-size: 18px;
          color: #666;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(-10px); }
          to { opacity: 1; transform: translateY(0); }
        }

    // 2. Thiết kế giao diện bảng hỏi cài đặt App

    #install-prompt {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      background: white; padding: 15px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: none; align-items: center; justify-content: space-between;
      z-index: 10000; border-left: 5px solid #e60000;
      animation: slideUp 0.5s ease-out;
    }
    #install-prompt p { margin: 0; font-family: sans-serif; font-size: 14px; color: #333; }
    #install-btn {
      background: #e60000; color: white; border: none;
      padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }

    </style>

<script>

    // 1. Cấu hình khởi tạo Flutter với cơ chế cập nhật thông minh
      window.isUpdatePromptVisible = false;
      // Cấu hình khởi tạo Flutter
      window.flutterConfiguration = {
        setUserSettings: (userSettings) => {
          userSettings.serviceWorker = {
            serviceWorkerVersion: '{{flutter_service_worker_version}}',
            onUpdateFound: (reg) => {
              const worker = reg.installing;
              if (!worker) return;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  const subText = document.querySelector('.sub-text');
                  if(subText) subText.innerHTML = "<b style='color:green'>Đã có bản cập nhật mới. Đang tải lại...</b>";
                  worker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          };
        }
      };
</script>

<script>
    // 1. Xử lý ẩn màn hình Loading thông minh
    (function() {
      var loading = document.getElementById('loading-indicator');
      var isLoaded = false;

      const hideLoading = () => {
        if (!loading || isLoaded) return;
        isLoaded = true;
        loading.style.transition = "opacity 0.8s ease";
        loading.style.opacity = "0";
        setTimeout(() => { if(loading.parentNode) loading.remove(); }, 800);
      };

      // Lắng nghe tín hiệu từ Flutter
      window.addEventListener('flutter-first-frame', () => {
        console.log("Flutter Ready");
        setTimeout(hideLoading, 800); // Đợi 0.8s để đảm bảo mượt
      });

      // Xử lý Timeout (10 giây)
      setTimeout(() => {
        if (!isLoaded) {
          const subText = document.querySelector('.sub-text');
          if (!navigator.onLine) {
            if (subText) subText.innerHTML = "<b style='color:red'>Lỗi: Không có kết nối mạng hoặc cập nhật thất bại.</b><br>Vui lòng kiểm tra mạng và thoát, khởi động lại ứng dụng.";
          } else {
            // Nếu có mạng mà vẫn chậm, thử ép hiển thị App (có thể dùng cache cũ)
            console.log("Timeout - Forcing hide loading");
            hideLoading();
          }
        }
      }, 10000);
    })();

    // 2. Ép kiểm tra cập nhật (reg.update)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then((reg) => {
        setInterval(() => { reg.update(); }, 1000 * 60 * 30);

        ['mousedown', 'keydown', 'touchstart'].forEach(evt => {
          window.addEventListener(evt, () => {
            const now = Date.now();
            if (!window.lastCheck || (now - window.lastCheck > 30000)) {
              reg.update().catch(() => {});
              window.lastCheck = now;
            }
          }, { once: false });
        });
      });

      // 3. Reload khi có bản mới
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
</script>
