<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_02">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app_02</title>
  <link rel="manifest" href="manifest.json">
</head>

<body style="margin: 0; padding: 0; background-color: #f5f5f5;">
<div id="loading-indicator">
  <div class="container">
    <img class="logo" src="icons/logocand.png" alt="Logo Công an" />
    <div class="spinner"></div>
    <p class="loading-text">HỆ THỐNG THAM MƯU CAQN</p>
    <p class="sub-text">Đang tải dữ liệu, vui lòng đợi...</p>
  </div>
</div>

<style>
  #loading-indicator {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    background-color: #ffffff; /* Màu nền trắng hoặc đỏ thẫm tùy ý bạn */
  }
  .container {
    text-align: center;
  }
  .logo {
    width: 120px;
    height: auto;
    margin-bottom: 20px;
    /* Hiệu ứng hiện dần cho logo */
    animation: fadeIn 1.5s ease-in-out;
  }
  .spinner {
    margin: 0 auto;
    width: 40px;
    height: 40px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #e60000; /* Màu đỏ cờ đặc trưng */
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loading-text {
    margin-top: 20px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #b30000; /* Màu đỏ thẫm */
    letter-spacing: 1px;
  }
  .sub-text {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #666;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script src="flutter_bootstrap.js" async></script>

<script>
  // --PHẦN 1: Khi Flutter đã khởi tạo xong, đoạn code này sẽ xóa màn hình Loading--

  window.addEventListener('load', function() {
    // Đợi một chút sau khi engine sẵn sàng để chuyển cảnh mượt mà
    setTimeout(function() {
      var loading = document.getElementById('loading-indicator');
      if (loading) {
        loading.style.transition = "opacity 0.5s ease";
        loading.style.opacity = "0";
        setTimeout(function() {
          loading.remove();
        }, 500);
      }
    }, 1000);
  });

  // --PHẦN 2: Kiểm tra cập nhật Service Worker--

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('flutter_service_worker.js?v=' + new Date().getTime())
        .then(reg => {
          // Kiểm tra nếu có bản update mới
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Chỉ hiện thông báo một lần duy nhất
                if (confirm("Hệ thống có bản cập nhật mới. Cập nhật ngay?")) {
                  if (reg.waiting) {
                    reg.waiting.postMessage({type: 'SKIP_WAITING'});
                  }
                }
              }
            };
          };
        });
    });

    // Lắng nghe sự kiện thay đổi controller để reload trang
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        window.location.reload();
        refreshing = true;
      }
    });

  }

</script>
</body>
